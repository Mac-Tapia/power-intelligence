name: scaffold-and-boundaries
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate repository structure
        run: python3 scripts/verify_structure.py
      - name: Test bootstrap/domain invariants
        run: python3 -m unittest discover -s tests/bootstrap -v
      - name: Validate Agent Skills and MCP governance
        run: python3 scripts/agents/validate_agent_setup.py
