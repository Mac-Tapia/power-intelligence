[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint.per-file-ignores]
# Tests and CLI scripts put packages/python/*/src on sys.path before importing them.
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
